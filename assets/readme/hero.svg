<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">material-replacement-tablet-video</title>
  <desc id="desc">A Codex skill for placing vertical video or offer pages inside a real tablet screen, with TTS, perspective warp, and QC previews.</desc>
  <defs>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16302f"/>
      <stop offset="0.52" stop-color="#0f1518"/>
      <stop offset="1" stop-color="#271a16"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#22282d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="390" rx="26" fill="#101316"/>
  <rect x="0" y="0" width="1200" height="390" rx="26" fill="url(#grid)" opacity="0.38"/>

  <g transform="translate(58 48)">
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#1b2326" stroke="#314148"/>
    <text x="18" y="22" fill="#8fd8ce" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Codex Skill</text>

    <text x="0" y="86" fill="#f6f3ea" font-size="52" font-weight="760" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">material-replacement</text>
    <text x="0" y="142" fill="#f6f3ea" font-size="52" font-weight="760" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">tablet-video</text>
    <text x="2" y="186" fill="#cbd2d4" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">把竖版素材真实嵌进餐饮场景里的实体平板</text>
    <text x="2" y="222" fill="#8a9299" font-size="20" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">四点透视、独立配音、屏幕 QC、1080x1920 H.264/AAC</text>

    <g transform="translate(0 266)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <rect x="0" y="0" width="142" height="38" rx="10" fill="#151b1f" stroke="#344046"/>
