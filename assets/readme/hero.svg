      <text x="176" y="25" fill="#f6f3ea">quad warp</text>
      <rect x="328" y="0" width="150" height="38" rx="10" fill="#151b1f" stroke="#344046"/>
      <text x="346" y="25" fill="#f6f3ea">QC frames</text>
      <rect x="494" y="0" width="142" height="38" rx="10" fill="#151b1f" stroke="#344046"/>
      <text x="512" y="25" fill="#f6f3ea">final mp4</text>
    </g>
  </g>

